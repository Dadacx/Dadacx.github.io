<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytor Pytań (Inline)</title>

    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] } };
    </script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="editor.css">
    <link rel="stylesheet" href="main.css">
    <style>

    </style>
</head>

<body>

    <div class="container">
        <h1>Edytor Bazy Pytań (v2)</h1>

        <div class="editor-panel">
            <div style="display:flex; justify-content: space-between; align-items: center;margin-bottom: 10px;">
                <h2 style="margin:0; font-size:1.2em;">Eksport / Import JSON</h2>
                <div class="btn-row" style="margin:0;">
                    <button class="btn-secondary" onclick="loadFromLocalStorage()">🔄 Przywróć ostatnie</button>
                    <button class="btn-secondary" onclick="loadFromBase()">📥 Załaduj z bazy</button>
                    <button class="btn-secondary" onclick="loadFromTextarea()">⬆️ Załaduj z textarea</button>
                    <button class="btn-success" onclick="copyJSON()">📋 Kopiuj</button>
                </div>
            </div>
            <textarea id="json-output" class="json-output"
                placeholder="Wklej tutaj treść pliku baza.json aby edytować..."></textarea>
        </div>

        <div class="editor-panel">
            <h2 style="font-size:1.2em; color:#03dac6;">➕ Dodaj nowe pytanie (na koniec listy)</h2>
            <div class="form-group">
                <input id="new-q" placeholder="Treść pytania...">
            </div>
            <div class="form-group">
                <textarea id="new-a" placeholder="Treść odpowiedzi..." style="min-height: 40px;"></textarea>
            </div>
            <div class="btn-row">
                <button class="btn-primary" onclick="addNewItem()">Dodaj</button>
            </div>
        </div>

        <h2>Lista pytań (<span id="count">0</span>)</h2>
        <div id="preview-list"></div>
    </div>

    <script>
        function applyFormatting(text) {
            // Zastępuje _x{tekst} na formatowanie
            // nowa linia: \\n            
            // pogrubienie: _b{tekst}
            // kursywa: _i{tekst}
            // podkreślenie: _u{tekst}
            // lista: _-{tekst} lub _-n{tekst} (n to liczba zagnieżdżeń)
            // kod: _code{tekst}_
            // lista numerowana: _list{punkt1|punkt2|punkt3} lub _listn{punkt1|punkt2|punkt3} (n to liczba zagnieżdżeń)
            
            let result = text.replace(/\\n/g, "\n");
            result = result.replace(/_b\{([^}]+)\}/g, '<b>$1</b>');
            result = result.replace(/_i\{([^}]+)\}/g, '<i>$1</i>');
            result = result.replace(/_u\{([^}]+)\}/g, '<u>$1</u>');

            result = result.replace(/_-(\d*)\{([^}]+)\}/g, function(match, count, content) {
                const tabs = parseInt(count || '1', 10);
                return '\t'.repeat(tabs) + '- ' + content;
            });
            result = result.replace(/_code\{([\s\S]*?)\}_/g, '<pre class="code-content"><code>$1</code></pre>');            
            result = result.replace(/_list(\d*)\{([^}]+)\}/g, function(match, count, content) {
                const tabs = parseInt(count || '1', 10);
                return '\t'.repeat(tabs) + '<ol>' + content.split('|').map(function(item) {
                    return '<li>' + item.trim() + '</li>';
                }).join('') + '</ol>';
            });         
            return result;
        }
        let questions = [];
        let currentlyEditingId = null; // Przechowuje indeks elementu aktualnie edytowanego

        const jsonOutput = document.getElementById('json-output');
        const previewList = document.getElementById('preview-list');
        const countSpan = document.getElementById('count');
        const inpNewQ = document.getElementById('new-q');
        const inpNewA = document.getElementById('new-a');

        const saveToLocalStorage = (data) => {
            try {
                localStorage.setItem('bazaLastData', JSON.stringify(data));
            } catch (e) {
                console.log("Błąd zapisu do localStorage:", e);
            }
        }

        // --- DODAWANIE ---
        function addNewItem() {
            const q = inpNewQ.value.trim();
            const a = inpNewA.value.trim();

            if (!q || !a) return alert("Wpisz pytanie i odpowiedź.");

            questions.push({
                pytanie: q,
                odp: a,
                imgs: [] // Domyślnie pusta tablica zdjęć przy szybkim dodawaniu
            });

            inpNewQ.value = "";
            inpNewA.value = "";

            updateJSON();
            renderList();

            // Scroll na sam dół do nowego elementu
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        // --- EDYCJA ---

        function startEditing(index) {
            currentlyEditingId = index;
            renderList(); // Przerysowujemy listę, żeby ten jeden element zmienił się w formularz
        }

        function cancelEditing() {
            currentlyEditingId = null;
            renderList();
        }

        function saveInline(index) {
            const qInput = document.getElementById(`edit-q-${index}`);
            const aInput = document.getElementById(`edit-a-${index}`);
            const imgInput = document.getElementById(`edit-img-${index}`);

            if (!qInput || !aInput) return;

            const newQ = qInput.value.trim();
            const newA = aInput.value.trim();

            // Parsowanie zdjęć
            const rawImgs = imgInput.value.split('\n');
            const cleanImgs = rawImgs.map(s => s.trim()).filter(s => s.length > 0);

            if (!newQ || !newA) return alert("Pytanie i odpowiedź nie mogą być puste.");

            // Aktualizacja w tablicy
            questions[index] = {
                pytanie: newQ,
                odp: newA,
                imgs: cleanImgs
            };

            currentlyEditingId = null;
            updateJSON();
            renderList();
        }

        function deleteItem(index) {
            if (confirm("Usunąć to pytanie?")) {
                questions.splice(index, 1);
                // Jeśli usunęliśmy element przed tym, który edytujemy, trzeba przesunąć indeks
                if (currentlyEditingId !== null && index < currentlyEditingId) {
                    currentlyEditingId--;
                } else if (currentlyEditingId === index) {
                    currentlyEditingId = null;
                }

                updateJSON();
                renderList();
            }
        }

        // --- LOGIKA JSON ---

        function updateJSON() {
            jsonOutput.value = JSON.stringify(questions, null, 2);
            countSpan.textContent = questions.length;
            if(questions.length > 0) saveToLocalStorage(questions);
        }

        async function loadFromBase() {
            try {
                const baza = prompt("Podaj nazwę bazy:");

                console.log("Pobieranie:", `./data/${baza}.json`);
                const response = await fetch(`./data/${baza}.json`);

                if (!response.ok) {
                    if (response.status === 404) throw new Error(`Nie ma bazy o takiej nazwie (${baza})`);
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const parsed = await response.json();;
                if (Array.isArray(parsed)) {
                    questions = parsed;
                    currentlyEditingId = null;
                    renderList();
                    countSpan.textContent = questions.length;
                    alert("Załadowano listę!");
                }
            } catch (e) {
                console.log(e);
                alert("Błąd: " + e.message);
            }
        }

        function loadFromTextarea() {
            console.log("Ładowanie z textarea...");
            try {
                const raw = jsonOutput.value.trim();
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    questions = parsed;
                    currentlyEditingId = null;
                    renderList();
                    countSpan.textContent = questions.length;
                    alert("Załadowano listę!");
                }
            } catch (e) {
                alert("Błąd JSON: " + e.message);
            }
        }

        function loadFromLocalStorage() {
            try {
                const raw = localStorage.getItem('bazaLastData');
                if (!raw) return alert("Brak zapisanych danych w localStorage.");
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    questions = parsed;
                    currentlyEditingId = null;
                    renderList();
                    countSpan.textContent = questions.length;
                    alert("Załadowano ostatnie dane z localStorage!");
                }
            } catch (e) {
                alert("Błąd przy ładowaniu z localStorage: " + e.message);
            }
        }

        function copyJSON() {
            jsonOutput.select();
            if (navigator.clipboard) {
                navigator.clipboard.writeText(jsonOutput.value);
                alert("Skopiowano!");
            } else {
                document.execCommand('copy');
                alert("Skopiowano!");
            }
        }

        // --- RENDEROWANIE ---

        function renderList() {
            previewList.innerHTML = "";

            questions.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'qa-item';

                // SPRAWDZAMY CZY TEN ELEMENT JEST EDYTOWANY
                if (index === currentlyEditingId) {
                    // --- TRYB EDYCJI (INLINE FORM) ---
                    div.classList.add('editing');

                    const imgsText = (item.imgs || []).join('\n');

                    div.innerHTML = `
                        <div class="qa-header">
                            <span class="qa-index">Edycja #${index + 1}</span>
                        </div>
                        
                        <div class="form-group">
                            <label>Pytanie:</label>
                            <textarea id="edit-q-${index}" rows="2">${escapeHtml(item.pytanie)}</textarea>
                        </div>

                        <div class="form-group">
                            <label>Odpowiedź:</label>
                            <textarea id="edit-a-${index}" rows="4">${escapeHtml(item.odp)}</textarea>
                        </div>

                        <div class="form-group">
                            <label>Zdjęcia (URL w nowych liniach):</label>
                            <textarea id="edit-img-${index}" rows="3" style="font-family:monospace; font-size:0.9em;">${escapeHtml(imgsText)}</textarea>
                        </div>

                        <div class="btn-row">
                            <button class="btn-secondary" onclick="cancelEditing()">Anuluj</button>
                            <button class="btn-success" onclick="saveInline(${index})">💾 Zapisz zmiany</button>
                        </div>
                    `;

                } else {
                    // --- TRYB PODGLĄDU (NORMALNY) ---

                    // Generowanie HTML dla zdjęć
                    let imagesHtml = '';
                    if (item.imgs && item.imgs.length > 0) {
                        imagesHtml = `<div class="qa-images">
                            ${item.imgs.map(url => `<img src="${url}" class="qa-thumb" onclick="window.open('${url}')" title="Kliknij, aby powiększyć">`).join('')}
                        </div>`;
                    }

                    div.innerHTML = `
                        <div class="qa-header">
                            <span class="qa-index">#${index + 1}</span>
                            <div style="display:flex; gap:10px;">
                                <button class="btn-secondary btn-sm" style="padding:4px 8px; font-size:12px;" onclick="startEditing(${index})">✏️ Edytuj</button>
                                <button class="btn-danger btn-sm" style="padding:4px 8px; font-size:12px;" onclick="deleteItem(${index})">🗑️</button>
                            </div>
                        </div>
                        <div class="qa-question-text">${applyFormatting(escapeHtml(item.pytanie))}</div>
                        <div class="qa-answer-text">${applyFormatting(escapeHtml(item.odp))}</div>
                        ${imagesHtml}
                    `;
                }

                previewList.appendChild(div);
            });

            // Odśwież MathJax po przerysowaniu DOM
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([previewList]).catch(err => console.log(err));
            }
        }

        function escapeHtml(text) {
            console.log("Escaping text:", text);
            if (!text) return "";
            console.log("Escaping text:", text);
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;")
                .replace(/\\n/g, "\n");
        }

        // Inicjalizacja
        updateJSON();

    </script>
</body>

</html>
