<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza Pytań (Dark Mode + Zdjęcia)</title>

    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="sciaga.css">
</head>

<body>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Szukaj pytania...">
    </div>

    <div id="container"></div>

    <script>
        function applyFormatting(text) {
            // Zastępuje _x{tekst} na formatowanie
            // nowa linia: \\n            
            // pogrubienie: _b{tekst}
            // kursywa: _i{tekst}
            // podkreślenie: _u{tekst}
            // lista: _-{tekst} lub _-n{tekst} (n to liczba zagnieżdżeń)
            // kod: _code{tekst}_
            // lista numerowana: _list{punkt1|punkt2|punkt3} lub _listn{punkt1|punkt2|punkt3} (n to liczba zagnieżdżeń)
            
            let result = text.replace(/\\n/g, "\n");
            result = result.replace(/_b\{([^}]+)\}/g, '<b>$1</b>');
            result = result.replace(/_i\{([^}]+)\}/g, '<i>$1</i>');
            result = result.replace(/_u\{([^}]+)\}/g, '<u>$1</u>');

            result = result.replace(/_-(\d*)\{([^}]+)\}/g, function(match, count, content) {
                const tabs = parseInt(count || '1', 10);
                return '\t'.repeat(tabs) + '- ' + content;
            });
            result = result.replace(/_code\{([\s\S]*?)\}_/g, '<pre class="code-content"><code>$1</code></pre>');            
            result = result.replace(/_list(\d*)\{([^}]+)\}/g, function(match, count, content) {
                const tabs = parseInt(count || '1', 10);
                return '\t'.repeat(tabs) + '<ol>' + content.split('|').map(function(item) {
                    return '<li>' + item.trim() + '</li>';
                }).join('') + '</ol>';
            });         
            return result;
        }

        const container = document.getElementById('container');
        const searchInput = document.getElementById('searchInput');
        let allData = [];

        async function fetchData() {
            try {
                var val = document.URL;
                var start = val.search(/q=/);
                let baza = "baza";

                if (start !== -1) {
                    var end = val.search(/&/);
                    baza = val.substring(start + 2, end !== -1 ? end : val.length);
                }

                console.log("Pobieranie:", `./data/${baza}.json`);
                const response = await fetch(`./data/${baza}.json`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                allData = await response.json();
                renderData(allData);

            } catch (error) {
                console.error("Błąd:", error);

                container.innerHTML = `<p style='color:#cf6679'>Nie udało się pobrać danych.</p>`;
            }
        }

        function renderData(dataArray) {
            container.innerHTML = '';

            if (!dataArray || dataArray.length === 0) {
                container.innerHTML = '<p>Brak wyników wyszukiwania.</p>';
                return;
            }

            dataArray.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('qa-card');

                // 1. Nagłówek (Pytanie)
                const header = document.createElement('div');
                header.classList.add('card-header');
                header.innerHTML = applyFormatting(item.pytanie);

                // 2. Treść (Odpowiedź)
                const body = document.createElement('div');
                body.classList.add('card-body');
                body.innerHTML = applyFormatting(item.odp);

                card.appendChild(header);
                card.appendChild(body);

                // 3. Zdjęcia (jeśli istnieją)
                if (item.imgs && Array.isArray(item.imgs) && item.imgs.length > 0) {
                    const imgContainer = document.createElement('div');
                    imgContainer.classList.add('card-images');

                    item.imgs.forEach(imgSrc => {
                        // Tworzymy obrazek
                        const img = document.createElement('img');
                        img.src = imgSrc;
                        img.classList.add('qa-image');
                        img.alt = "Zdjęcie do pytania";
                        // img.loading = "lazy"; // Leniwe ładowanie dla wydajności

                        // Opcjonalnie: Kliknięcie otwiera oryginał w nowej karcie
                        img.ondblclick = () => window.open(imgSrc, '_blank');

                        imgContainer.appendChild(img);
                    });

                    card.appendChild(imgContainer);
                }

                container.appendChild(card);
            });

            // Odświeżenie MathJax
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise([container]).catch((err) => console.log(err));
            }
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredData = allData.filter(item =>
                item.pytanie.toLowerCase().includes(searchTerm)
            );
            renderData(filteredData);
        });

        fetchData();

    </script>
</body>

</html>
